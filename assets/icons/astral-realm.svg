<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="astralGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="astralCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#e8e0ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#b0a0e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6050a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#e0c060" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c09030" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ribbonViolet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#b080e0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6040a0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ribbonIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#5060c0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#303880" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Outermost halo — very faint, suggests the infinite expanse -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#8070c0" stroke-width="0.5" opacity="0.3"/>

  <!-- Flowing nebula ribbons crossing through the icon -->
  <g filter="url(#astralGlow)">
    <!-- Gold ribbon -->
    <path d="M15,80 Q50,60 100,75 Q150,90 185,65" fill="none" stroke="url(#ribbonGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M20,88 Q55,68 105,82 Q155,96 180,72" fill="none" stroke="url(#ribbonGold)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Violet ribbon -->
    <path d="M25,130 Q65,105 100,120 Q140,138 175,110" fill="none" stroke="url(#ribbonViolet)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30,138 Q68,114 102,128 Q142,144 170,118" fill="none" stroke="url(#ribbonViolet)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Indigo ribbon -->
    <path d="M40,45 Q75,55 100,42 Q130,28 170,50" fill="none" stroke="url(#ribbonIndigo)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Scattered realm "lanterns" — tiny glowing dots suggesting distant planes -->
  <g filter="url(#astralGlow)">
    <circle cx="45"  cy="55"  r="2"   fill="#e0d0ff" opacity="0.7"/>
    <circle cx="155" cy="48"  r="1.8" fill="#ffe0a0" opacity="0.6"/>
    <circle cx="72"  cy="145" r="1.5" fill="#c0b0ff" opacity="0.5"/>
    <circle cx="140" cy="140" r="2"   fill="#e0c0ff" opacity="0.6"/>
    <circle cx="60"  cy="95"  r="1.2" fill="#ffe8c0" opacity="0.5"/>
    <circle cx="150" cy="100" r="1.3" fill="#d0c0ff" opacity="0.5"/>
    <circle cx="100" cy="160" r="1.5" fill="#c8c0e8" opacity="0.4"/>
    <circle cx="35"  cy="120" r="1"   fill="#e0d8ff" opacity="0.4"/>
    <circle cx="165" cy="75"  r="1"   fill="#ffe0b0" opacity="0.4"/>
  </g>

  <!-- Central cosmic eye / aperture -->
  <circle cx="100" cy="100" r="30" fill="url(#astralCore)" filter="url(#astralGlow)"/>

  <!-- Concentric rings suggesting depth / layers of reality -->
  <circle cx="100" cy="100" r="24" fill="none" stroke="#b0a0e0" stroke-width="0.8" opacity="0.5" stroke-dasharray="3 5">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="18" fill="none" stroke="#c8b8f0" stroke-width="0.6" opacity="0.4" stroke-dasharray="2 4">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- Bright centre point — the threshold -->
  <circle cx="100" cy="100" r="5" fill="#e8e0ff" opacity="0.8"/>
  <circle cx="100" cy="100" r="2.5" fill="#ffffff" opacity="0.9"/>

  <!-- Outer orbit dots — slow rotation suggests cosmic drift -->
  <g opacity="0.4">
    <circle cx="100" cy="30" r="1.8" fill="#c0b8e8">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="100" r="1.5" fill="#d0c0f0">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="170" r="1.8" fill="#c8b0e0">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="100" r="1.5" fill="#d8d0f0">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Very faint outer connecting arcs -->
  <g fill="none" stroke="#9080c0" stroke-width="0.5" opacity="0.2">
    <ellipse cx="100" cy="100" rx="70" ry="40" transform="rotate(20 100 100)"/>
    <ellipse cx="100" cy="100" rx="65" ry="35" transform="rotate(-30 100 100)"/>
  </g>
</svg>
