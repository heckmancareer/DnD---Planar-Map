<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#080612"/>
    </radialGradient>
    <radialGradient id="glowHalo" cx="50%" cy="28%" r="22%">
      <stop offset="0%"  stop-color="#9070d0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9070d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="280" fill="url(#bgGrad)"/>

  <!-- Subtle star field -->
  <g fill="#ffffff" opacity="0.25">
    <circle cx="18"  cy="22"  r="0.8"/>
    <circle cx="55"  cy="10"  r="0.6"/>
    <circle cx="90"  cy="18"  r="1"/>
    <circle cx="140" cy="8"   r="0.7"/>
    <circle cx="175" cy="25"  r="0.8"/>
    <circle cx="160" cy="50"  r="0.5"/>
    <circle cx="28"  cy="60"  r="0.6"/>
    <circle cx="10"  cy="100" r="0.7"/>
    <circle cx="190" cy="90"  r="0.6"/>
    <circle cx="180" cy="140" r="0.5"/>
    <circle cx="15"  cy="180" r="0.6"/>
    <circle cx="185" cy="210" r="0.7"/>
    <circle cx="30"  cy="250" r="0.5"/>
    <circle cx="170" cy="265" r="0.6"/>
  </g>

  <!-- Halo glow behind head -->
  <circle cx="100" cy="80" r="44" fill="url(#glowHalo)"/>

  <!-- Cloak / body silhouette -->
  <path d="M100 118
           C80 120, 55 130, 40 155
           L30 240
           C30 255, 40 265, 55 268
           L145 268
           C160 265, 170 255, 170 240
           L160 155
           C145 130, 120 120, 100 118 Z"
        fill="#2a2040" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Cloak highlight edge -->
  <path d="M100 118 C80 120, 55 130, 40 155 L30 240"
        fill="none" stroke="#6050a0" stroke-width="1" opacity="0.4"/>
  <path d="M100 118 C120 120, 145 130, 160 155 L170 240"
        fill="none" stroke="#6050a0" stroke-width="1" opacity="0.4"/>

  <!-- Hood -->
  <path d="M62 95
           C60 70, 70 52, 100 48
           C130 52, 140 70, 138 95
           C138 108, 130 118, 100 118
           C70 118, 62 108, 62 95 Z"
        fill="#1e1838" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Hood inner shadow -->
  <ellipse cx="100" cy="88" rx="22" ry="20" fill="#0e0c20" opacity="0.7"/>

  <!-- Subtle face hint — two faint eyes -->
  <g opacity="0.45" filter="url(#softGlow)">
    <ellipse cx="91" cy="85" rx="3.5" ry="2.5" fill="#a090d0"/>
    <ellipse cx="109" cy="85" rx="3.5" ry="2.5" fill="#a090d0"/>
  </g>

  <!-- Small arcane rune on chest -->
  <g fill="none" stroke="#7060b0" stroke-width="1.2" opacity="0.4" filter="url(#softGlow)">
    <circle cx="100" cy="160" r="8"/>
    <line x1="100" y1="152" x2="100" y2="168"/>
    <line x1="92"  y1="160" x2="108" y2="160"/>
    <line x1="94"  cy="154" x2="106" y2="166"/>
    <line x1="106" cy="154" x2="94"  y2="166"/>
  </g>

  <!-- Faint bottom vignette -->
  <rect x="0" y="220" width="200" height="60"
        fill="url(#bgGrad)" opacity="0.5"/>
</svg>
