<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="vaultGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vaultDoor" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#363d50"/>
      <stop offset="60%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </radialGradient>
    <radialGradient id="vaultHub" cx="38%" cy="35%" r="60%">
      <stop offset="0%"  stop-color="#d0dcec"/>
      <stop offset="50%" stop-color="#7888a4"/>
      <stop offset="100%" stop-color="#383e4c"/>
    </radialGradient>
    <radialGradient id="vaultBolt" cx="35%" cy="30%" r="65%">
      <stop offset="0%"  stop-color="#b8c8dc"/>
      <stop offset="100%" stop-color="#484e60"/>
    </radialGradient>
  </defs>

  <!-- Outer decorative rings -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#7888a8" stroke-width="5" opacity="0.6" filter="url(#vaultGlow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#404858" stroke-width="1.5" opacity="0.4"/>

  <!-- Cardinal tick marks on outer ring -->
  <g fill="none" stroke="#8898b0" stroke-width="2" opacity="0.5">
    <line x1="100" y1="12" x2="100" y2="22"/>
    <line x1="100" y1="178" x2="100" y2="188"/>
    <line x1="12"  y1="100" x2="22"  y2="100"/>
    <line x1="178" y1="100" x2="188" y2="100"/>
  </g>

  <!-- Vault door body -->
  <circle cx="100" cy="100" r="74" fill="url(#vaultDoor)" stroke="#7888a0" stroke-width="4.5"
          filter="url(#vaultGlow)"/>

  <!-- Locking bolt nubs — 8 evenly spaced around the door rim -->
  <g fill="url(#vaultBolt)" stroke="#90a0b8" stroke-width="1.2" filter="url(#vaultGlow)">
    <circle cx="174" cy="100" r="5.5"/>  <!-- 0°   right       -->
    <circle cx="152" cy="48"  r="5.5"/>  <!-- 45°  upper-right -->
    <circle cx="100" cy="26"  r="5.5"/>  <!-- 90°  top         -->
    <circle cx="48"  cy="48"  r="5.5"/>  <!-- 135° upper-left  -->
    <circle cx="26"  cy="100" r="5.5"/>  <!-- 180° left        -->
    <circle cx="48"  cy="152" r="5.5"/>  <!-- 225° lower-left  -->
    <circle cx="100" cy="174" r="5.5"/>  <!-- 270° bottom      -->
    <circle cx="152" cy="152" r="5.5"/>  <!-- 315° lower-right -->
  </g>

  <!-- Door face groove rings -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#505870" stroke-width="2"   opacity="0.7"/>
  <circle cx="100" cy="100" r="57" fill="none" stroke="#303848" stroke-width="0.8" opacity="0.4"/>

  <!-- Wheel handle ring -->
  <circle cx="100" cy="100" r="42" fill="none" stroke="#8898b8" stroke-width="2.5"
          filter="url(#vaultGlow)"/>

  <!-- Wheel spokes — 6 spokes every 60°, from hub edge (r=13) to wheel ring (r=42) -->
  <g stroke="#7888b0" stroke-width="2.5" stroke-linecap="round" filter="url(#vaultGlow)">
    <line x1="113"  y1="100"   x2="142"  y2="100"/>    <!-- 0°   right       -->
    <line x1="106.5" y1="88.7" x2="121"  y2="63.6"/>   <!-- 60°  upper-right -->
    <line x1="93.5"  y1="88.7" x2="79"   y2="63.6"/>   <!-- 120° upper-left  -->
    <line x1="87"   y1="100"   x2="58"   y2="100"/>    <!-- 180° left        -->
    <line x1="93.5"  y1="111.3" x2="79"  y2="136.4"/>  <!-- 240° lower-left  -->
    <line x1="106.5" y1="111.3" x2="121" y2="136.4"/>  <!-- 300° lower-right -->
  </g>

  <!-- Inner hub ring -->
  <circle cx="100" cy="100" r="20" fill="none" stroke="#506080" stroke-width="1" opacity="0.45"/>

  <!-- Center hub -->
  <circle cx="100" cy="100" r="13" fill="url(#vaultHub)" stroke="#a0b0c8" stroke-width="2.5"
          filter="url(#vaultGlow)"/>

  <!-- Keyhole -->
  <circle cx="100" cy="97"   r="2.8" fill="#080e18"/>
  <polygon points="97.5,99 102.5,99 100,105" fill="#080e18"/>

  <!-- Silver particle accents -->
  <g fill="#8898b0" opacity="0.55">
    <circle cx="34"  cy="60"  r="1.5"/>
    <circle cx="166" cy="58"  r="1.5"/>
    <circle cx="34"  cy="142" r="1"/>
    <circle cx="166" cy="144" r="1"/>
  </g>

  <!-- Diamond sparks in the corners outside the ring -->
  <g fill="#9090b0" opacity="0.5" filter="url(#vaultGlow)">
    <polygon points="38,38  40,33  42,38  40,43"/>
    <polygon points="162,38 164,33 166,38 164,43"/>
    <polygon points="38,162 40,157 42,162 40,167"/>
    <polygon points="162,162 164,157 166,162 164,167"/>
  </g>

  <!-- Orbiting silver mote -->
  <circle cx="100" cy="12" r="2.5" fill="#b0c0d8" opacity="0.65">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="-360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>
