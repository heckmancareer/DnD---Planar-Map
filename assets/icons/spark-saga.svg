<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="sparkCore" cx="50%" cy="45%" r="50%">
      <stop offset="0%"  stop-color="#fffef0"/>
      <stop offset="30%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#8a6a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#d4a030"/>
      <stop offset="100%" stop-color="#6a4e18"/>
    </linearGradient>
  </defs>

  <!-- Outer arcane circle -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#a07820" stroke-width="5" opacity="0.6" filter="url(#sparkGlow)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#6a5020" stroke-width="1.5" opacity="0.4"/>

  <!-- Rune marks on the circle -->
  <g fill="none" stroke="#c09030" stroke-width="2" opacity="0.5">
    <line x1="100" y1="12" x2="100" y2="22"/>
    <line x1="100" y1="178" x2="100" y2="188"/>
    <line x1="12" y1="100" x2="22" y2="100"/>
    <line x1="178" y1="100" x2="188" y2="100"/>
  </g>

  <!-- Open book shape -->
  <g filter="url(#sparkGlow)">
    <!-- Left page -->
    <path d="M100 75 C90 72, 60 70, 50 75 L50 135 C60 130, 90 132, 100 137Z"
          fill="none" stroke="#c09030" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M100 75 C110 72, 140 70, 150 75 L150 135 C140 130, 110 132, 100 137Z"
          fill="none" stroke="#c09030" stroke-width="3" stroke-linejoin="round"/>
    <!-- Spine -->
    <line x1="100" y1="75" x2="100" y2="137" stroke="#a07820" stroke-width="2"/>
    <!-- Page lines left -->
    <g stroke="#806020" stroke-width="1" opacity="0.5">
      <line x1="62" y1="88" x2="92" y2="86"/>
      <line x1="62" y1="98" x2="92" y2="96"/>
      <line x1="62" y1="108" x2="92" y2="106"/>
      <line x1="62" y1="118" x2="92" y2="117"/>
    </g>
    <!-- Page lines right -->
    <g stroke="#806020" stroke-width="1" opacity="0.5">
      <line x1="108" y1="86" x2="138" y2="88"/>
      <line x1="108" y1="96" x2="138" y2="98"/>
      <line x1="108" y1="106" x2="138" y2="108"/>
      <line x1="108" y1="117" x2="138" y2="118"/>
    </g>
  </g>

  <!-- Central spark/lightning bolt above the book -->
  <g filter="url(#sparkGlow)">
    <polygon points="100,30 108,55 102,55 112,72 96,58 103,58"
             fill="#f0c040" stroke="#fffef0" stroke-width="1" opacity="0.95"/>
    <!-- Spark glow -->
    <circle cx="103" cy="50" r="12" fill="url(#sparkCore)" opacity="0.6"/>
  </g>

  <!-- Small spark particles -->
  <g fill="#f0d060" opacity="0.7">
    <circle cx="72" cy="52" r="1.5"/>
    <circle cx="132" cy="48" r="1.5"/>
    <circle cx="56" cy="68" r="1"/>
    <circle cx="148" cy="64" r="1"/>
    <circle cx="80" cy="38" r="1"/>
    <circle cx="124" cy="36" r="1"/>
  </g>

  <!-- Star accents -->
  <g fill="#d0a030" opacity="0.5">
    <polygon points="38,50 40,46 42,50 40,54"/>
    <polygon points="162,55 164,51 166,55 164,59"/>
    <polygon points="42,145 44,141 46,145 44,149"/>
    <polygon points="156,148 158,144 160,148 158,152"/>
  </g>

  <!-- Rotating orbiting dot -->
  <circle cx="100" cy="100" r="0" fill="#f0d060">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="18" r="2.5" fill="#f0d060" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate"
      from="0 100 100" to="360 100 100" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>
