<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="wildGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a0ffcc"/>
      <stop offset="50%" stop-color="#40c080"/>
      <stop offset="100%" stop-color="#186038" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#80e0d0"/>
      <stop offset="100%" stop-color="#3090a0"/>
    </linearGradient>
  </defs>

  <!-- Outer ring — thorny / organic -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1a6840" stroke-width="3" filter="url(#wildGlow)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#0e3d22" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Swirling vine ring -->
  <g fill="none" stroke="#1a8048" stroke-width="2.5" stroke-linecap="round" filter="url(#wildGlow)">
    <path d="M100 12 Q130 30, 170 40 Q188 70, 185 100 Q188 130, 170 160 Q130 175, 100 188 Q70 175, 30 160 Q12 130, 15 100 Q12 70, 30 40 Q70 30, 100 12Z"/>
    <!-- Counter-vine -->
    <path d="M100 18 Q65 35, 38 52 Q18 78, 20 100 Q18 125, 38 148 Q65 168, 100 182 Q135 168, 162 148 Q182 125, 180 100 Q182 78, 162 52 Q135 35, 100 18Z" stroke="#126035" stroke-width="1.5"/>
  </g>

  <!-- Thorn accents on the vines -->
  <g fill="#1a8048" opacity="0.8">
    <polygon points="168,42 175,38 172,46"/>
    <polygon points="32,42 25,38 28,46"/>
    <polygon points="185,105 192,100 188,108"/>
    <polygon points="15,105 8,100 12,108"/>
    <polygon points="168,158 175,162 172,154"/>
    <polygon points="32,158 25,162 28,154"/>
  </g>

  <!-- Crystal formations (left cluster) -->
  <g fill="url(#crystalGrad)" opacity="0.7" filter="url(#wildGlow)">
    <polygon points="50,120 55,85 60,120"/>
    <polygon points="42,125 50,95 58,125"/>
    <polygon points="56,118 60,92 64,118"/>
  </g>

  <!-- Crystal formations (right cluster) -->
  <g fill="url(#crystalGrad)" opacity="0.7" filter="url(#wildGlow)">
    <polygon points="140,120 145,88 150,120"/>
    <polygon points="134,125 140,98 146,125"/>
    <polygon points="148,118 152,95 156,118"/>
  </g>

  <!-- Twisted tree silhouettes -->
  <g fill="none" stroke="#0e3d22" stroke-width="2.5" stroke-linecap="round">
    <!-- Left tree -->
    <path d="M65,155 L62,130 Q58,118 50,110"/>
    <path d="M62,130 Q60,120 55,115"/>
    <path d="M62,130 Q68,118 72,112"/>
    <!-- Right tree -->
    <path d="M135,155 L138,130 Q142,118 150,110"/>
    <path d="M138,130 Q140,120 145,115"/>
    <path d="M138,130 Q132,118 128,112"/>
  </g>

  <!-- Leaf clusters on trees -->
  <g fill="#1a6840" opacity="0.6">
    <circle cx="48" cy="108" r="6"/>
    <circle cx="55" cy="112" r="5"/>
    <circle cx="72" cy="110" r="5"/>
    <circle cx="152" cy="108" r="6"/>
    <circle cx="145" cy="112" r="5"/>
    <circle cx="128" cy="110" r="5"/>
  </g>

  <!-- Central gateway portal -->
  <circle cx="100" cy="100" r="28" fill="url(#portalCore)" opacity="0.6"/>
  <circle cx="100" cy="100" r="22" fill="none" stroke="#60e0a0" stroke-width="1.5" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="16" fill="none" stroke="#40c080" stroke-width="1" opacity="0.5" stroke-dasharray="4 3">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Portal centre bright point -->
  <circle cx="100" cy="100" r="6" fill="#d0ffe8"/>
  <circle cx="100" cy="100" r="3" fill="#ffffff"/>

  <!-- Tiny floating particles around the portal -->
  <g fill="#80ffc0" opacity="0.5">
    <circle cx="82"  cy="82"  r="1.5"/>
    <circle cx="120" cy="84"  r="1"/>
    <circle cx="115" cy="118" r="1.5"/>
    <circle cx="80"  cy="116" r="1"/>
    <circle cx="100" cy="70"  r="1"/>
    <circle cx="100" cy="132" r="1.2"/>
    <circle cx="72"  cy="98"  r="1"/>
    <circle cx="130" cy="102" r="1.2"/>
  </g>

  <!-- Mountainscape silhouette along the bottom -->
  <path d="M20,170 L40,148 L55,158 L75,138 L90,150 L100,135 L110,150 L125,138 L145,158 L160,148 L180,170 Z"
        fill="#0a2e16" opacity="0.5"/>
  <path d="M15,175 L35,158 L60,168 L80,150 L100,142 L120,150 L140,168 L165,158 L185,175 Z"
        fill="#0e3d22" opacity="0.4"/>
</svg>
