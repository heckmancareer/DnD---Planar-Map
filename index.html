<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tales of Echo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@14/marked.min.js"></script>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div id="overlay">
    <div class="overlay-content">
      <h1 class="overlay-title">Tales of Echo</h1>
      <p class="overlay-subtitle">Navigate the Realms</p>
      <p class="overlay-hint">Click anywhere to enter</p>
    </div>
  </div>

  <div id="sections-host">
    <section id="section-realm-map" class="site-section" data-section="realm-map">
      <div id="realms-container"></div>
    </section>

    <section id="section-campaigns" class="site-section" data-section="campaigns">
      <div id="campaigns-container" class="campaigns-container"></div>
    </section>

    <section id="section-heroes" class="site-section" data-section="heroes">
      <div id="heroes-container" class="heroes-container"></div>
    </section>

    <section id="section-journals" class="site-section" data-section="journals">
      <div id="journals-container" class="journals-container"></div>
    </section>
  </div>

  <!-- Tray lives at body level (outside sections-host) to avoid stacking context issues during opacity transitions -->
  <div id="realm-tray">
    <div class="tray-panel">
      <button id="tray-close" class="tray-close" aria-label="Close">&times;</button>
      <h2 id="tray-name" class="tray-name"></h2>
      <p id="tray-arcana" class="tray-arcana"></p>
      <hr class="tray-divider">
      <div id="tray-body" class="tray-body"></div>
    </div>
  </div>

  <nav id="site-nav" aria-label="Site navigation">
    <ul class="nav-list">
      <li class="nav-item">
        <button class="nav-btn" data-target="realm-map" aria-current="page">
          <span class="nav-icon" aria-hidden="true">✦</span>
          <span class="nav-label">Realm Map</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-target="campaigns" aria-current="false">
          <span class="nav-icon" aria-hidden="true">⚔</span>
          <span class="nav-label">Campaigns</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-target="heroes" aria-current="false">
          <span class="nav-icon" aria-hidden="true">⚜</span>
          <span class="nav-label">Hall of Heroes</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-btn" data-target="journals" aria-current="false">
          <span class="nav-icon" aria-hidden="true">📜</span>
          <span class="nav-label">Journals of Echo</span>
        </button>
      </li>
    </ul>
  </nav>

  <script src="js/starfield.js"></script>
  <script src="js/realms-data.js"></script>
  <script src="js/realms.js"></script>
  <script src="js/campaigns-data.js"></script>
  <script src="js/campaigns.js"></script>
  <script src="js/heroes-data.js"></script>
  <script src="js/heroes.js"></script>
  <script src="js/journals-data.js"></script>
  <script src="js/journals.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
